# ============================================================
# Cấu hình ứng dụng Spring Boot - Hệ thống Quản lý Sân Bóng
# ============================================================

server:
  # Current origin also serves direct clients. Do not trust client-supplied forwarding headers.
  forward-headers-strategy: none
  port: ${APP_PORT:8080}
  address: ${APP_HOST:127.0.0.1}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
    include-exception: false
  servlet:
    context-path: /
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        secure: ${APP_SECURE_COOKIE:false}

spring:
  profiles:
    active: ${APP_ENV:dev}
  application:
    name: san-bong-backend

  datasource:
    url: ${APP_DB_URL:jdbc:sqlserver://localhost:1433;databaseName=QuanLySanBong;encrypt=false;trustServerCertificate=true}
    username: ${APP_DB_USER}
    password: ${APP_DB_PASSWORD}
    hikari:
      connection-timeout: 5000
      validation-timeout: 2000
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver

  jpa:
    hibernate:
      ddl-auto: validate
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  lifecycle:
    timeout-per-shutdown-phase: 20s
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Ho_Chi_Minh
    default-property-inclusion: non_null

logging:
  file:
    name: ${APP_LOG_FILE:logs/application.log}
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 14
      total-size-cap: 200MB
  level:
    com.sanbong: INFO
    org.springframework.security: WARN

app:
  environment: ${APP_ENV:dev}
  payment:
    bank:
      enabled: ${APP_BANK_TRANSFER_ENABLED:false}
      bin: ${APP_BANK_BIN:}
      name: ${APP_BANK_NAME:}
      account-number: ${APP_BANK_ACCOUNT_NUMBER:}
      account-name: ${APP_BANK_ACCOUNT_NAME:}
      qr-file: ${APP_BANK_QR_FILE:}
  booking:
    # ISO dates, comma-separated; explicit calendar, without invented holiday prices.
    holidays: ${APP_BOOKING_HOLIDAYS:}
  security:
    migrate-legacy-passwords: ${APP_MIGRATE_LEGACY_PASSWORDS:false}
    login-limit:
      per-identifier: ${APP_LOGIN_LIMIT_PER_IDENTIFIER:5}
      per-ip: ${APP_LOGIN_LIMIT_PER_IP:30}
      window-seconds: ${APP_LOGIN_LIMIT_WINDOW_SECONDS:300}
      max-entries: ${APP_LOGIN_LIMIT_MAX_ENTRIES:10000}
