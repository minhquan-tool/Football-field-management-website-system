<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đối soát &amp; Báo cáo - FC-UTE</title>
    <link rel="stylesheet" href="css/tailwind.css">
    <link href="vendor/fontawesome/css/all.min.css" rel="stylesheet">
    <link href="vendor/montserrat/montserrat.css" rel="stylesheet">
    
    
    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #f4f7f6;
        }
        /* Tùy chỉnh thanh cuộn cho sidebar mượt mà hơn */
        ::-webkit-scrollbar {
            width: 5px;
        }
        ::-webkit-scrollbar-track {
            background: transparent; 
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1; 
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8; 
        }
    </style>
    <style>[hidden] { display: none !important; }</style>
<style>@media print{body{display:block!important;height:auto!important;overflow:visible!important;background:white!important}body>aside,body>div>header,form,#reportPages,#reportActions,[data-mobile-menu],body>button{display:none!important}body>div,main,main>div{height:auto!important;max-height:none!important;overflow:visible!important;width:100%!important}table{font-size:9pt!important}thead{display:table-header-group}tr{break-inside:avoid}main{padding:0!important}#reportTotals{break-inside:avoid}}</style>
<link rel="stylesheet" href="css/fc-ute.css"><link rel="stylesheet" href="css/experience.css"><script src="js/ui.js" defer></script><link rel="stylesheet" href="css/accounting-pages.css"></head>
<body data-accounting-page="reports" class="flex h-screen overflow-hidden text-gray-800">

    <!-- Sidebar (Thanh điều hướng phân quyền) -->
    <aside class="w-72 bg-white shadow-2xl flex flex-col h-full hidden md:flex z-20 border-r border-gray-100">
        <!-- Logo -->
        <div class="h-20 flex items-center justify-center border-b border-gray-100 px-4 bg-white">
            <img src="assets/hcmute-logo.png" 
                 alt="Logo HCMUTE" class="h-12 w-12 object-contain mr-3">
            <div class="flex flex-col">
                <span class="font-bold text-xl text-brand-700 leading-tight">FC-UTE</span>
                
            </div>
        </div>

        <!-- Menu Links -->
        <nav class="flex-1 overflow-y-auto py-4 px-3 space-y-6"><div data-navigation-loading>Đang tải chức năng theo quyền…</div></nav>

        <!-- Logout -->
        <div class="p-4 border-t border-gray-100 bg-gray-50">
            <a href="dang-nhap" class="flex items-center gap-3 text-gray-600 hover:text-red-600 hover:bg-red-50 px-4 py-2.5 rounded-xl font-bold transition-colors">
                <i class="fa-solid fa-arrow-right-from-bracket w-5 text-center"></i> Đăng xuất
            </a>
        </div>
    </aside>

    <!-- Main Content Area -->
    <div class="flex-1 flex flex-col h-full overflow-hidden relative">
        
        <!-- Header -->
        <header class="h-20 bg-white shadow-sm flex items-center justify-between px-6 lg:px-8 z-10 border-b border-gray-100">
            <button type="button" data-mobile-menu aria-label="Mở menu" class="md:hidden text-gray-500 hover:text-brand-600 focus:outline-none">
                <i class="fa-solid fa-bars text-xl"></i>
            </button>

           

            <!-- User Profile & Utils -->
            <div class="flex items-center gap-5 ml-auto">
                <a href="nhan-su-phan-quyen#logs" class="text-gray-400 hover:text-brand-600 transition-colors" title="Nhật ký hoạt động">
                    <i class="fa-solid fa-clock-rotate-left text-lg"></i>
                </a>
                <div class="h-8 w-px bg-gray-200"></div>
                <div class="flex items-center gap-3 cursor-pointer">
                    <div class="text-right hidden sm:block">
                        <p class="text-sm font-bold text-gray-800" data-account-name>Đang tải...</p>
                        <p class="text-xs text-brand-600 font-medium">Chủ sân</p>
                    </div>
                    <div class="h-10 w-10 rounded-full bg-brand-100 border-2 border-brand-500 flex items-center justify-center text-brand-700">
                        <i class="fa-solid fa-user-shield"></i>
                    </div>
                </div>
            </div>
        </header>

        <!-- Dashboard Content -->
<main class="flex-1 overflow-y-auto p-6 lg:p-8"><header class="ac-heading"><div><p class="ac-eyebrow">Đối soát tài chính FC-UTE</p><h1>Đối soát &amp; Báo cáo</h1><p>Xem số liệu theo kỳ, sân và loại báo cáo; phân biệt khoản phát sinh với tiền thực nhận.</p></div></header><p id="reportStatus" role="status" class="text-sm mb-3"></p>
<form id="reportFilter" data-api-ready="true" class="bg-white rounded-2xl border p-5 flex flex-wrap gap-3 mb-6"><label>Từ ngày<input id="reportFrom" type="date" required class="border rounded-lg p-2"></label><label>Đến ngày<input id="reportTo" type="date" required class="border rounded-lg p-2"></label><label>Sân<select id="reportPitch" class="border rounded-lg p-2"><option value="">Tất cả</option></select></label><label>Báo cáo<select id="reportType" class="border rounded-lg p-2"></select></label><button class="bg-brand-600 text-white rounded-lg p-2">Tìm kiếm</button></form>
<div id="refundFilters" hidden class="flex flex-wrap gap-3 mb-4"><select id="refundStatus" class="border rounded-lg p-2"><option value="">Tất cả trạng thái</option><option>Chờ duyệt</option><option>Đã hoàn</option><option>Từ chối</option></select><input id="refundBooking" placeholder="Mã đặt sân" maxlength="10" class="border rounded-lg p-2"><select id="refundMethod" class="border rounded-lg p-2"><option value="">Mọi phương thức</option><option>Tiền mặt</option><option>Chuyển khoản</option></select></div>
<p id="reportDefinition" class="text-xs mb-3"></p><div id="reportTotals" class="grid grid-cols-2 lg:grid-cols-4 gap-3 mb-5"></div>
<div class="bg-white rounded-2xl border p-4 overflow-x-auto"><table class="w-full text-sm"><thead id="reportHead"></thead><tbody id="reportRows"></tbody></table><div id="reportPages" hidden class="app-pagination mt-3"><button id="reportPrev">Trước</button><span id="reportPage"></span><button id="reportNext">Sau</button></div></div>
<section id="methodSection" hidden class="bg-white border rounded-2xl p-5 mt-5"><h3 class="font-bold mb-3">Thu và hoàn theo phương thức</h3><table class="w-full text-sm"><thead><tr><th>Phương thức</th><th>Số thu</th><th>Tiền thu</th><th>% tiền thu</th><th>Số hoàn</th><th>Tiền hoàn</th><th>Thực nhận</th></tr></thead><tbody id="methodRows"></tbody></table></section>
</main>
    </div>

    <script src="js/role-navigation.js" defer></script>
    <script src="js/auth.js" defer></script>
    <script src="js/reports.js" defer></script>
</body>
</html>
